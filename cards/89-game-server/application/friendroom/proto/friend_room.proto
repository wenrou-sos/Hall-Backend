syntax = "proto3";
package friend.room.proto;

import "pkg/mod/gitlab.iplaystar.net/game-server/common@v0.0.8/proto/common.proto";
import "pkg/mod/gitlab.iplaystar.net/game-server/game-setting@v0.0.8/proto/game_setting.proto";
import "pkg/mod/gitlab.iplaystar.net/game-server/lobby-setting@v0.0.9/proto/lobby_setting.proto";
import "89-game-server/models/proto/common_89.proto";
import "89-game-server/application/gamesetting89/proto/game_setting_89.proto";
import "89-game-server/application/lobbysetting89/proto/lobby_setting_89.proto";

message FriendRoomJoinCall {
    common89.proto.EMSGID msgid                                            = 1;
    game.setting.proto.ConfigCall game_config_call                         = 2;
    int32 number                                                           = 3;
}

message FriendRoomJoinRecall {
    common89.proto.EMSGID msgid                                            = 1;
    common.proto.Status.Code status_code                                   = 2;
    game.setting89.proto.ConfigRecall game_config_recall                   = 3;
    int32 number                                                           = 4;
}

message FriendRoomLeaveCall {
    common89.proto.EMSGID msgid                                            = 1;
    lobby.setting.proto.ConfigCall lobby_config_call                       = 2;
    int32 number                                                           = 3;
}

message FriendRoomLeaveRecall {
    common89.proto.EMSGID msgid                                            = 1;
    common.proto.Status.Code status_code                                   = 2;
    lobby.setting89.proto.ConfigRecall lobby_config_recall                 = 3;
    int32 number                                                           = 4;
    string uuid                                                            = 5;
}

message FriendRoomDestroy {
    common89.proto.EMSGID msgid                                            = 1;
    common.proto.Status.Code status_code                                   = 2;
    lobby.setting89.proto.ConfigRecall lobby_config_recall                 = 3;
    int32 number                                                           = 4;
    string uuid                                                            = 5;
}

message FriendRoomHostChanged {
    common89.proto.EMSGID msgid                                            = 1;
    int32 number                                                           = 2;
    string uuid                                                            = 3;
    string uid                                                             = 4;
    int32 seat                                                             = 5;
}

message FriendRoomGameStart {
    common89.proto.EMSGID msgid                                            = 1;
    int32 number                                                           = 2;
    string uuid                                                            = 3;
}
