syntax = "proto3";
package game.setting89.proto;

import "pkg/mod/gitlab.iplaystar.net/game-server/common@v0.0.8/proto/common.proto";
import "pkg/mod/gitlab.iplaystar.net/game-server/auth@v0.1.6/proto/auth.proto";

message ConfigRecall {
    message Bets {
        repeated uint32 bet                                                = 1;
    }
    common.proto.EMSGID msgid                                              = 1;
    common.proto.Status.Code status_code                                   = 2;
    string room_uuid                                                       = 3;
    repeated Bets levels                                                   = 4;
    repeated uint32 line                                                   = 5;
    repeated uint32 rates                                                  = 6;
    uint32 rates_default_index                                             = 7;
    uint32 balance_limit                                                   = 8;
    uint32 banker_limit                                                    = 9;
    repeated uint32 waiting_time                                           = 10;
    repeated uint32 transfer_credit                                        = 11;
    repeated string languages                                              = 12;
    uint32 languages_default_index                                         = 13;
    auth.proto.PlayerInfo player_info                                      = 14;
    uint64 balance                                                         = 15;
    uint64 cent                                                            = 16;
}

message StripsRecall {
    message SymbolDef {
        enum PayType {
            K_xFORTEST                      = 0;
            K_xBET                          = 1;
            K_xTOTALBET                     = 2;
            K_xTOTALBET_BONUSTIMES          = 3;
            K_xTOTALBETxRANDOM              = 4;
        }
        enum SymbolType {
            K_FORTEST                       = 0;
            K_SYMBOL                        = 1;
            K_BONUS                         = 2;
        }
        uint32 symbol_id                    = 1;
        SymbolType symbol_type              = 2;
        uint32 layer_id                     = 3;
        PayType pay_type                    = 4;
        repeated int64 pays                 = 5;
        repeated int32 rounds               = 6;
    }
    common.proto.EMSGID msgid               = 1;
    common.proto.Status.Code status_code    = 2;
    repeated SymbolDef all_symbol_def       = 3;
    uint32 symbol_max_layer                 = 4;
    string room_uuid                        = 5;
}