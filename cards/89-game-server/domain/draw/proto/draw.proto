syntax = "proto3";
package draw.proto;

import "89-game-server/models/proto/common_89.proto";

message DrawRoundStart {
    common89.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
}

message DrawRoundEnd {
    common89.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
}

message BroadcastDrawRoundStart {
    common89.proto.EMSGID msgid                                            = 1;
    DrawRoundStart draw_round_start                                        = 2;
}

message BroadcastDrawRoundEnd {
    common89.proto.EMSGID msgid                                            = 1;
    DrawRoundEnd draw_round_end                                            = 2;
}

message DrawCall {
    common89.proto.EMSGID msgid                                            = 1;
    string token                                                           = 2;
    string room_uuid                                                       = 3;
    int32 seat                                                             = 4;
    bool status                                                            = 5;
}

message DrawRecall {
    common89.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
    int32 card                                                             = 4;
    int32 sum_point                                                        = 5;
}

message BroadcastDrawRecall {
    common89.proto.EMSGID msgid                                            = 1;
    DrawRecall draw_recall                                                 = 2;
}

message DrawTimeout {
    common89.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
    int32 card                                                             = 4;
    int32 sum_point                                                        = 5;
}

message BroadcastDrawTimeout {
    common89.proto.EMSGID msgid                                            = 1;
    DrawTimeout draw_timeout                                               = 2;
}