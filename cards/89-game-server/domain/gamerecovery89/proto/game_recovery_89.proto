syntax = "proto3";
package game.recovery89.proto;

import "pkg/mod/gitlab.iplaystar.net/game-server/common@v0.0.8/proto/common.proto";

message GameRecovery {
    common.proto.EMSGID msgid                                              = 1;
    Snapshot snapshot                                                      = 2;
}

message Snapshot {
    string server_id                                                       = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
    int32 subgame_id                                                       = 4;
    uint32 rate                                                            = 5;
    uint32 bet_idx                                                         = 6;
    int32 status                                                           = 7;
}
