syntax = "proto3";
package game.settingFS.proto;

import "pkg/mod/gitlab.iplaystar.net/game-server/common@v0.1.2/proto/common.proto";
import "pkg/mod/gitlab.iplaystar.net/game-server/auth@v0.1.7/proto/auth.proto";
import "colorgame-game-server/models/proto/common_FS.proto";

message ConfigRecall {
    message Bets {
        repeated uint32 bet                                                = 1;
    }
    common.proto.EMSGID msgid                                              = 1;
    common.proto.Status.Code status_code                                   = 2;
    string room_uuid                                                       = 3;
    repeated Bets levels                                                   = 4;
    repeated uint32 line                                                   = 5;
    repeated uint32 rates                                                  = 6;
    uint32 rates_default_index                                             = 7;
    repeated string languages                                              = 8;
    uint32 languages_default_index                                         = 9;
    auth.proto.PlayerInfo player_info                                      = 10;
    uint64 balance                                                         = 11;
    JoinedRoomInfo joinedRoomInfo                                          = 12;
    repeated uint32 bet_area_limit                                         = 13;
    repeated SeatsHoldBets seat_hold_bets                                  = 14;
}

message StripsRecall {
    message SymbolDef {
        enum PayType {
            K_xFORTEST                      = 0;
            K_xBET                          = 1;
            K_xTOTALBET                     = 2;
            K_xTOTALBET_BONUSTIMES          = 3;
            K_xTOTALBETxRANDOM              = 4;
        }
        enum SymbolType {
            K_FORTEST                       = 0;
            K_SYMBOL                        = 1;
            K_BONUS                         = 2;
        }
        uint32 symbol_id                    = 1;
        SymbolType symbol_type              = 2;
        uint32 layer_id                     = 3;
        PayType pay_type                    = 4;
        repeated int64 pays                 = 5;
        repeated int32 rounds               = 6;
    }
    common.proto.EMSGID msgid               = 1;
    common.proto.Status.Code status_code    = 2;
    repeated SymbolDef all_symbol_def       = 3;
    uint32 symbol_max_layer                 = 4;
    string room_uuid                        = 5;
}

message JoinedRoomInfo {
    commonFS.proto.EMSGID msgid                = 1;
    string room_uuid                           = 2;
    int32 status                               = 3;
    int32 seat                                 = 4;
    repeated auth.proto.PlayerInfo player_info = 5;
}

//座位所持有的籌碼
message SeatsHoldBets{
    commonFS.proto.EMSGID msgid = 1;
    int32 seat = 2;
    repeated BetAreaBets BetAreaBets = 3;
}

//下注區域的籌碼
message BetAreaBets {
    commonFS.proto.EMSGID msgid = 1;
    uint32 betType = 2;
    repeated BetsIndexAndNum betsIndexAndNum = 3;
  }
  
  //籌碼的索引與數量
  message BetsIndexAndNum {
    commonFS.proto.EMSGID msgid = 1;
    uint32 betIndex = 2;
    uint32 betNum = 3;
  }