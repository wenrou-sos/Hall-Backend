syntax = "proto3";
package banker.proto;

import "52-game-server/models/proto/common_52.proto";
import "pkg/mod/gitlab.iplaystar.net/game-server/auth@v0.1.7/proto/auth.proto";
import "52-game-server/domain/probability/proto/probability.proto";

message RoundStart {
    common52.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    string banker_uuid                                                     = 3;
    repeated auth.proto.PlayerInfo player_infos                            = 4;
}

message RoundEnd {
    common52.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
}

message PlayerRoundStart{
    common52.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
    repeated int32 call_cards                                              = 4;
}

message BroadcastPlayerRoundStart{
    common52.proto.EMSGID msgid                                            = 1;
    PlayerRoundStart player_round_start                                    = 2;
}

message Deal {
    common52.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    probability.proto.Cards cards                                          = 3;
    int32 pool                                                             = 4;
    int32 seat                                                             = 5;
}

message Card {
    repeated int32 hand                                                    = 1;
    int32 sum_point                                                        = 2;
}

message ShowdownCall{
    common52.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 seat                                                             = 3;
}