<script src="assets/js/op_menu.js"></script>
<script type="text/javascript">

    var member_obj = [];
    
    if(!getCookie('clientToken')) {
        window.location.href = '/index.html';
    } else {
        $.ajax({
            // type: 'POST',
            type: 'GET',
            // url: url_in_op_menu + "/LoginByNormal",
            url: url_in_op_menu + "/LoginByToken",
            // data: { 
            //     username: getCookie('user'),
            //     password: getCookie('password')
            // },
            cache: false,
            dataType: 'json',
            success: function(json) {

                var data = json.clientdata;
                if(data.statuscode != 0) {
                    alert('執行錯誤!!');
                    window.location.href = '/';
                } else {
                    member_obj = data;
                }

            },
            error: function(xhr, desc, err) {
                alert("HTTP Status code:" + xhr.status);
                delCookie('clientToken');
                window.location.href = '/';
            }
        });
    }

    function submit() {
        $.ajax({
            type: 'GET',
            url: url_in_op_menu + "/serialinput",
            data: { 
                memberid: member_obj.memberid,
                serial: $('#serialnumber').val(),
            },
            cache: false,
            dataType: 'json',
            success: function(json) {
                // var data = json.clientdata;
                if(json.status_code == 0) {
                    $('.error-msg').hide();
                    $('.correct-msg').show();
                }else if(json.status_code == 3){
                    alert("登入逾時，請重新登入!!");
                    delCookie('clientToken');
                    window.location.href = '/';
                } else {
				    if(json.msg != undefined &&
					json.msg != "很抱歉,您的卡別未達,無法領取,謝謝您!!" && 
					json.msg != "很抱歉,您的等級未達,無法領取,謝謝您!!" &&
					json.msg != ""
					){
                        alert(json.msg);
                    }
                    $('.correct-msg').hide();
                    if(json.status_code == undefined)
                        $('.error-msg').text('序號輸入失敗');
                    else
                        $('.error-msg').text('序號輸入失敗'+ json.status_code);
                    $('.error-msg').show();
                }
            },
            error: function(xhr, desc, err) {
                alert("HTTP Status code:" + xhr.status);
            }
        });
        
    }
</script>
