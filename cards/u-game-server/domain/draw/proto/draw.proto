syntax = "proto3";
package draw.proto;

import "u-game-server/models/proto/commonU.proto";
import "u-game-server/domain/probability/proto/probability.proto";

message DrawCall {
    common.u.proto.EMSGID msgid                                            = 1;
    string token                                                           = 2;
    string room_uuid                                                       = 3;
    int32 seat                                                             = 4;
    bool status                                                            = 5;
}

message DrawRecall {
    common.u.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 card                                                             = 3;
    probability.proto.PlayerData player_data                               = 4;
    uint32 pool                                                            = 5;
}

message BroadcastDrawRecall {
    common.u.proto.EMSGID msgid                                            = 1;
    DrawRecall draw_recall                                                 = 2;

}

message DrawTimeout {
    common.u.proto.EMSGID msgid                                            = 1;
    string room_uuid                                                       = 2;
    int32 card                                                             = 3;
    probability.proto.PlayerData player_data                               = 4;
    uint32 pool                                                            = 5;
}

message BroadcastDrawTimeout {
    common.u.proto.EMSGID msgid                                            = 1;
    DrawTimeout draw_timeout                                               = 2;
}