syntax = "proto3";
package errorcode.proto;
import "pkg/mod/gitlab.iplaystar.net/game-server/common@v0.0.4/proto/common.proto";

enum Level {
    WARNING                         = 0;
    ERROR                           = 1;
    FATAL                           = 2;
}

message Error {
    common.proto.EMSGID msgid       = 1;
    Level level                     = 2;
    string code                     = 3;
}
